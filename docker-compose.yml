services:
  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://venturepilot:venturepilot@db:5432/venturepilot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: venturepilot
      POSTGRES_USER: venturepilot
      POSTGRES_PASSWORD: venturepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venturepilot -d venturepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
